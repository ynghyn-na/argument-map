<main>
  <p class="note">기능 확인을 위해 만든 가상 예시입니다. 실제 사건이나 통계가 아닙니다.</p>
  <h1>캠퍼스 중앙도로의 자전거 통행을 제한하자</h1>
  <p>보행자가 많은 캠퍼스 중앙도로에서는 자전거 통행을 제한해야 한다. 지난달 중앙도로에서 보행자와 자전거가 부딪히는 사고 세 건이 접수됐다. 수업이 끝나는 시간에는 보행자와 자전거의 이동 경로가 겹친다.</p>
  <p>한편 자전거로 통학하는 학생들은 통행 제한으로 이동 시간이 늘어날 수 있다고 우려한다. 우회로를 안내하는 방법도 함께 검토할 필요가 있다.</p>
</main>
